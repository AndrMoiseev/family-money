[versions]
archunit = "1.4.1"
detekt = "2.0.0-alpha.5"
foojay-resolver = "1.0.0"
jacoco = "0.8.14"
junit = "5.13.4"
kora = "1.2.18"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
ktlint = "1.8.0"
openapi-generator = "7.14.0"
spotless = "7.2.1"

[libraries]
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kora-bom = { module = "ru.tinkoff.kora:kora-parent", version.ref = "kora" }
kora-config-hocon = { module = "ru.tinkoff.kora:config-hocon" }
kora-database-flyway = { module = "ru.tinkoff.kora:database-flyway" }
kora-database-jdbc = { module = "ru.tinkoff.kora:database-jdbc" }
kora-http-server-undertow = { module = "ru.tinkoff.kora:http-server-undertow" }
kora-json-module = { module = "ru.tinkoff.kora:json-module" }
kora-logging-logback = { module = "ru.tinkoff.kora:logging-logback" }
kora-openapi-generator = { module = "ru.tinkoff.kora:openapi-generator", version.ref = "kora" }
kora-symbol-processors = { module = "ru.tinkoff.kora:symbol-processors", version.ref = "kora" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.7" }

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
